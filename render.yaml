services:
  - type: web
    name: agentops-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run on every start (no-op when up to date, skipped without DATABASE_URL).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8        # match your local minor version; use a full version number
      - key: ENVIRONMENT
        value: production
      - key: OPENROUTER_MODEL
        value: google/gemma-4-26b-a4b-it:free
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: agentops-prod
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false          # Neon connection string (pooled)
      - key: CORS_ORIGINS
        sync: false          # the frontend's address, e.g. https://agentops-web.onrender.com
      - key: DEMO_ENABLED
        value: "true"        # visitor demo; see docs/DEMO_MODE.md
      - key: DEMO_QUESTIONS_PER_DAY
        value: "60"          # set from your model's free quota

  # Frontend: a static site (free, served from Render's CDN, no cold starts).
  # Static sites only get build-time variables, so VITE_API_URL is baked in at build.
  - type: web
    name: agentops-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_URL
        sync: false          # your API address, e.g. https://agentops-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      # Optional, stricter: enable after you have confirmed the site works.
      # - path: /*
      #   name: Content-Security-Policy
      #   value: "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https: http://localhost:* http://127.0.0.1:*; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
