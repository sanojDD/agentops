services:
  - type: web
    name: agentops-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run on every start (no-op when up to date, skipped without DATABASE_URL).
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8        # match your local minor version; use a full version number
      - key: ENVIRONMENT
        value: production
      - key: OPENROUTER_MODEL
        value: google/gemma-4-26b-a4b-it:free
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: agentops-prod
      - key: OPENROUTER_API_KEY
        sync: false
      - key: LANGSMITH_API_KEY
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false          # Neon connection string (pooled)
